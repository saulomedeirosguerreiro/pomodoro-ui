<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guardião Pomodoro</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('pomogarden:theme')
          if (theme === 'dark' || theme === 'light') {
            document.documentElement.dataset.theme = theme
          }
        } catch (e) {
          /* localStorage indisponível — mantém o tema padrão (light) */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
